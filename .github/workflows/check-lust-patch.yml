name: Check LustStation Android patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android port
        uses: actions/checkout@v4
        with:
          ref: luststation-277
          persist-credentials: false

      - name: Check patch exists
        run: |
          test -f patches/fobos-mobile.patch
          echo "Android patch found"
          wc -l patches/fobos-mobile.patch

      - name: Checkout LustStation RobustToolbox
        uses: actions/checkout@v4
        with:
          repository: space-wizards/RobustToolbox
          ref: 08a3d120b7029d03e60b44b23fed2b2659ed3224
          path: lust-robust
          persist-credentials: false

      - name: Test Android patch compatibility
        id: patch
        shell: bash
        run: |
          set +e

          git -C lust-robust apply \
            --check \
            ../patches/fobos-mobile.patch \
            > patch-result.txt 2>&1

          RESULT=$?

          if [ "$RESULT" -eq 0 ]; then
            echo "PATCH COMPATIBLE" | tee -a patch-result.txt
          else
            echo "PATCH INCOMPATIBLE" | tee -a patch-result.txt
          fi

          cat patch-result.txt
          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lust-patch-report
          path: patch-result.txt
          if-no-files-found: warn

      - name: Show final result
        run: |
          if [ "${{ steps.patch.outputs.exit_code }}" = "0" ]; then
            echo "Android patch applies cleanly."
          else
            echo "Android patch requires adaptation."
          fi
